[project]
name = "researchagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "deepagents>=0.4.5",
    "fastapi",
    "google-search-results>=2.4.2",
    "langchain>=1.2.10",
    "langchain-community>=0.4.1",
    "langchain-mcp-adapters>=0.2.1",
    "langchain-openai>=0.2.0",
    "langfuse>=3.14.5",
    "langgraph-checkpoint-postgres>=3.0.4",
    "loguru>=0.7.3",
    "psycopg[binary]",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]",
]

[project.scripts]
deepagent-api = "src.api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src/api", "src/config", "src/observability", "src/agents"]
omit = [
    "src/config/agent_configs.py",
    "src/config/prompts.py",
    "src/observability/langfuse_config.py",
    "src/agents/subagents.py",
    "src/tools/*",
]
